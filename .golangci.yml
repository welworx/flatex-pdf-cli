version: "2"
linters:
  default: none
  enable:
    - bodyclose
    - dupword
    - errcheck
    - errname
    - gosec
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unused
    - whitespace
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: _test\.go
      - linters:
          - gosec
        path: _test\.go
      # country.go is a table of German country names, which misspell reads as
      # English typos ("Australien" -> "Australian").
      - linters:
          - misspell
        path: internal/parser/country\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
