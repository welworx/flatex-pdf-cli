name: govulncheck
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
    paths:
      - '**.go'
      - go.mod
      - go.sum
      - .github/workflows/govulncheck.yml
  schedule:
    - cron: '30 4 * * 1'
permissions:
  contents: read
jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Not golang/govulncheck-action: it pins GOTOOLCHAIN=local, so the job
      # cannot build a module whose go directive is newer than whatever version
      # setup-go happens to carry, which is exactly the situation when a
      # security release is the thing being adopted. Leaving GOTOOLCHAIN at its
      # default lets the go command fetch the required toolchain, which is what
      # the CI and release workflows already rely on.
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
